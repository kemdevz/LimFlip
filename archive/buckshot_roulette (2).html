<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUCKSHOT ROULETTE</title>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --blood:#8B0000;--crimson:#cc0000;--dark:#06080a;
  --felt:#0d1a0d;--felt2:#0a150a;--wood:#1a0e06;--wood2:#2a1608;
  --text:#c8b89a;--text-dim:#7a6a55;--gold:#d4a017;
  --live:#cc3300;--blank:#3a3a2a;
}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:'Special Elite',cursive;color:var(--text);user-select:none}

/* ── POV SCENE ── */
#scene{
  width:100%;height:100vh;
  perspective:500px;
  perspective-origin:50% 5%;
  position:relative;overflow:hidden;
  background:radial-gradient(ellipse at 50% 0%,#1a1208 0%,#06080a 70%,#000 100%);
}

/* atmosphere layers */
#grain{position:fixed;inset:0;pointer-events:none;z-index:900;opacity:0.045;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
#scanlines{position:fixed;inset:0;pointer-events:none;z-index:899;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.12) 2px,rgba(0,0,0,0.12) 4px)}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:898;
  background:radial-gradient(ellipse at 50% 40%,transparent 30%,rgba(0,0,0,0.92) 100%)}
#flicker{position:fixed;inset:0;pointer-events:none;z-index:897;animation:flick 9s infinite}
@keyframes flick{0%,93%,95.5%,98%,100%{opacity:1}94%{opacity:0.82}96%{opacity:0.91}99%{opacity:0.87}}
#blood-overlay{position:fixed;inset:0;pointer-events:none;z-index:896;opacity:0;transition:opacity 0.6s;
  background:radial-gradient(ellipse at 50% 60%,rgba(120,0,0,0.55),transparent 70%)}

/* ── TABLE SURFACE (3D transformed plane) ── */
#table{
  position:absolute;
  left:0;right:0;
  bottom:-60px;
  height:85vh;
  transform-origin:bottom center;
  transform:rotateX(48deg);
  background:
    radial-gradient(ellipse at 50% 30%,#143014 0%,#0d1a0d 40%,#081008 100%);
  border-top:4px solid #2a3a1a;
  box-shadow:inset 0 0 120px rgba(0,0,0,0.8), inset 0 40px 80px rgba(0,0,0,0.5);
  overflow:hidden;
}
/* felt texture lines */
#table::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(92deg,transparent,transparent 3px,rgba(0,0,0,0.06) 3px,rgba(0,0,0,0.06) 4px),
             repeating-linear-gradient(2deg,transparent,transparent 3px,rgba(0,0,0,0.06) 3px,rgba(0,0,0,0.06) 4px);
}
/* table edge wood trim */
#table-edge{
  position:absolute;
  left:0;right:0;bottom:-10px;height:32px;
  background:linear-gradient(180deg,#3a1e08,#1a0e04);
  border-top:3px solid #5a3010;
  border-bottom:3px solid #0a0604;
}

/* ── LAMP LIGHT POOL on table ── */
#lamp-pool{
  position:absolute;
  left:50%;top:0;
  width:600px;height:300px;
  transform:translateX(-50%);
  background:radial-gradient(ellipse at 50% 0%,rgba(180,130,40,0.18) 0%,rgba(140,100,20,0.08) 40%,transparent 70%);
  pointer-events:none;
}

/* ── DEALER AREA (top of table) ── */
#dealer-zone{
  position:absolute;
  top:6%;left:50%;
  transform:translateX(-50%);
  width:70%;
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
#dealer-figure{
  width:120px;height:140px;position:relative;display:flex;flex-direction:column;align-items:center;
}
/* dealer silhouette built from CSS */
#dealer-head{
  width:52px;height:56px;
  background:radial-gradient(ellipse at 50% 40%,#1a1208,#0a0804);
  border-radius:50% 50% 45% 45%;
  border:1px solid #3a2a18;
  position:relative;overflow:hidden;
}
#dealer-head::before{/* hat brim */
  content:'';position:absolute;top:-18px;left:-10px;right:-10px;height:22px;
  background:#0d0a06;border-radius:4px 4px 0 0;border-bottom:2px solid #2a1a08;
}
#dealer-head::after{/* hat top */
  content:'';position:absolute;top:-42px;left:4px;right:4px;height:26px;
  background:#0a0804;border:1px solid #2a1a08;
}
/* dealer eyes */
.dealer-eye{position:absolute;top:22px;width:8px;height:6px;
  background:#cc2200;border-radius:50%;box-shadow:0 0 8px rgba(200,0,0,0.9),0 0 16px rgba(200,0,0,0.4)}
#eye-l{left:11px}#eye-r{right:11px}
/* dealer suit body */
#dealer-body{
  width:80px;height:55px;
  background:linear-gradient(180deg,#100c08,#0a0806);
  border-radius:4px 4px 0 0;
  border:1px solid #2a1a10;
  position:relative;
}
#dealer-body::before{/* collar/tie */
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:14px;height:28px;
  background:linear-gradient(180deg,#3a1a08,#1a0804);
  clip-path:polygon(30% 0,70% 0,60% 60%,50% 100%,40% 60%);
}
/* dealer arms on table */
#dealer-arms{
  display:flex;gap:80px;margin-top:-4px;
}
.d-arm{width:30px;height:12px;background:#0a0806;border-radius:2px;border:1px solid #2a1a10;}
.d-hand{width:22px;height:14px;background:#1a1008;border-radius:40% 40% 35% 35%;border:1px solid #3a2010;margin-top:-2px;}

#dealer-hp-row{display:flex;gap:5px;align-items:center}
.d-heart{font-size:16px;filter:drop-shadow(0 0 4px rgba(180,0,0,0.7));transition:all 0.3s}
.d-heart.dead{opacity:0.2;filter:none}
#dealer-speech{
  font-family:'Share Tech Mono',monospace;font-size:10px;color:#aa7755;
  font-style:italic;text-align:center;min-height:14px;letter-spacing:1px;
}
#dealer-items-row{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;min-height:20px}

/* ── GUN on table center ── */
#gun-zone{
  position:absolute;
  top:38%;left:50%;
  transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
#gun-svg{width:280px;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.9));transition:transform 0.1s}

/* ── LOADING ANIMATION ── */
#loading-overlay{
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  display:none;
  flex-direction:column;align-items:center;gap:15px;
  z-index:950;
  background:rgba(0,0,0,0.85);
  padding:30px 50px;
  border:2px solid var(--gold);
  border-radius:8px;
  box-shadow:0 0 40px rgba(212,160,23,0.3),inset 0 0 30px rgba(0,0,0,0.8);
}
#loading-text{
  font-family:'Creepster',cursive;
  font-size:28px;
  color:var(--gold);
  letter-spacing:4px;
  text-shadow:0 0 20px rgba(212,160,23,0.8);
  animation:loadPulse 1s ease-in-out infinite;
}
@keyframes loadPulse{0%,100%{opacity:0.7;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
#loading-shells{
  display:flex;gap:8px;align-items:center;
}
.loading-shell{
  width:18px;height:36px;
  border-radius:4px 4px 3px 3px;
  border:2px solid rgba(255,255,255,0.15);
  background:linear-gradient(180deg,#2a2a20,#1a1a15);
  opacity:0;
  transform:translateX(-30px);
  animation:shellLoad 0.4s ease-out forwards;
  box-shadow:0 4px 8px rgba(0,0,0,0.6);
}
.loading-shell.live{background:linear-gradient(180deg,#ff6600,#8a2000);box-shadow:0 0 12px rgba(255,80,0,0.6),0 4px 8px rgba(0,0,0,0.6)}
@keyframes shellLoad{to{opacity:1;transform:translateX(0)}}
#loading-count{
  font-family:'Share Tech Mono',monospace;
  font-size:16px;
  color:var(--text);
  letter-spacing:3px;
  opacity:0;
  animation:countFade 0.5s ease-out 0.3s forwards;
}
@keyframes countFade{to{opacity:1}}

/* ── SHELLS row on table ── */
#shell-zone{
  position:absolute;
  top:57%;left:50%;
  transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
#shell-display{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.shell{
  width:14px;height:28px;
  border-radius:3px 3px 2px 2px;
  border:1px solid rgba(255,255,255,0.08);
  transition:all 0.3s;
  position:relative;
}
.shell.live{background:linear-gradient(180deg,#ff5500,#7a1500);box-shadow:0 0 8px rgba(255,60,0,0.5)}
.shell.blank{background:linear-gradient(180deg,#4a4a38,#1e1e14)}
.shell.used{opacity:0.12}
.shell.known-live{box-shadow:0 0 10px rgba(255,80,0,0.9),0 0 20px rgba(255,40,0,0.4)}
.shell.known-blank{box-shadow:0 0 8px rgba(80,160,80,0.7)}
#shell-info{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--text-dim);letter-spacing:2px;opacity:0;transition:opacity 0.5s;font-weight:bold;text-shadow:0 0 10px rgba(200,180,140,0.5)}
#shell-info.visible{opacity:1}

/* ── ITEMS zone (player's side of table, near edge) ── */
#player-items-zone{
  position:absolute;
  bottom:8%;left:50%;
  transform:translateX(-50%) rotateX(48deg);
  transform-style:preserve-3d;
  display:flex;gap:16px;justify-content:center;flex-wrap:wrap;
  z-index:10;
}
.item-btn{
  background:linear-gradient(145deg,rgba(20,14,6,0.95),rgba(8,6,2,0.95));
  border:2px solid #5a3a18;
  color:var(--text);
  font-family:'Special Elite',cursive;
  font-size:13px;padding:12px 16px;
  cursor:pointer;transition:all 0.3s;
  position:relative;
  border-radius:6px;
  text-shadow:0 2px 4px rgba(0,0,0,0.9);
  box-shadow:0 8px 20px rgba(0,0,0,0.8),0 4px 8px rgba(0,0,0,0.6),inset 0 2px 0 rgba(255,255,255,0.08);
  min-width:80px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  transform:rotateX(-48deg);
  transform-style:preserve-3d;
}
.item-btn:hover:not(:disabled){
  background:linear-gradient(145deg,rgba(40,24,8,0.98),rgba(16,10,4,0.98));
  border-color:var(--gold);color:var(--gold);
  transform:translateY(-4px) scale(1.05);
  box-shadow:0 12px 28px rgba(0,0,0,0.9),0 6px 12px rgba(0,0,0,0.7),0 0 16px rgba(212,160,23,0.4);
}
.item-btn:disabled{opacity:0.28;cursor:not-allowed}
.item-btn .icount{
  position:absolute;top:-8px;right:-8px;
  background:linear-gradient(145deg,var(--crimson),#8B0000);
  color:#fff;font-size:10px;font-weight:bold;
  width:20px;height:20px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Share Tech Mono',monospace;
  box-shadow:0 2px 6px rgba(0,0,0,0.8),0 0 8px rgba(200,0,0,0.5);
  border:1px solid #ff3333;
}

/* ── HUD: player HP + action buttons (screen-space, not transformed) ── */
#hud{
  position:fixed;bottom:0;left:0;right:0;
  z-index:500;
  display:flex;flex-direction:column;align-items:center;gap:0;
  pointer-events:none;
  padding-bottom:20px;
}
#action-row{
  display:flex;gap:16px;padding:10px 0 12px;
  pointer-events:all;
}
.act-btn{
  padding:10px 26px;
  font-family:'Creepster',cursive;font-size:20px;letter-spacing:3px;
  border:2px solid;cursor:pointer;transition:all 0.2s;
  background:rgba(6,8,10,0.9);
  backdrop-filter:blur(4px);
}
.act-btn.shoot-self{color:#ffaa44;border-color:#8B5500}
.act-btn.shoot-self:hover:not(:disabled){background:#8B5500;color:#fff;box-shadow:0 0 18px rgba(139,85,0,0.6)}
.act-btn.shoot-dealer{color:var(--crimson);border-color:var(--blood)}
.act-btn.shoot-dealer:hover:not(:disabled){background:var(--blood);color:#fff;box-shadow:0 0 18px rgba(139,0,0,0.6)}
.act-btn:disabled{opacity:0.3;cursor:not-allowed}

#player-hp-bar{
  display:flex;align-items:center;gap:8px;
  padding:4px 0 6px;
  pointer-events:none;
}
.p-heart{font-size:20px;filter:drop-shadow(0 0 5px rgba(200,0,0,0.6));transition:all 0.3s}
.p-heart.dead{opacity:0.18;filter:none}
#turn-badge{
  font-family:'Creepster',cursive;font-size:13px;letter-spacing:3px;
  padding:3px 14px;border:1px solid;margin-bottom:2px;
  pointer-events:none;
}
#turn-badge.your{color:var(--gold);border-color:#6a5000;background:rgba(6,8,10,0.7)}
#turn-badge.dealer{color:#cc3333;border-color:#6a0000;background:rgba(6,8,10,0.7)}

/* ── LOG strip ── */
#log-strip{
  position:fixed;left:12px;bottom:100px;
  width:260px;z-index:500;
  display:flex;flex-direction:column;gap:1px;
  pointer-events:none;
}
.log-line{
  font-family:'Share Tech Mono',monospace;font-size:9px;
  padding:2px 6px;background:rgba(6,8,10,0.75);
  border-left:2px solid;line-height:1.4;
  animation:fadein 0.3s ease;
}
@keyframes fadein{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.log-line.live{color:#ff6644;border-color:#8B2200}
.log-line.blank{color:#7a9a6a;border-color:#2a3a1a}
.log-line.item{color:var(--gold);border-color:#6a4a00}
.log-line.event{color:#8888aa;border-color:#2a2a4a}
.log-line.death{color:var(--crimson);border-color:var(--blood);font-weight:bold}

/* ── STATS top-right ── */
#stats-hud{
  position:fixed;right:12px;top:12px;
  font-family:'Share Tech Mono',monospace;font-size:9px;
  color:var(--text-dim);line-height:1.9;
  background:rgba(6,8,10,0.6);padding:6px 10px;
  border:1px solid #2a1a08;z-index:500;
}
#stats-hud span{color:var(--text)}

/* ── ROUND BANNER ── */
#round-banner{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:'Creepster',cursive;font-size:64px;color:var(--gold);
  letter-spacing:10px;z-index:800;opacity:0;pointer-events:none;
  text-shadow:0 0 40px rgba(212,160,23,0.9),0 0 80px rgba(212,160,23,0.3);
  transition:opacity 0.5s;
}

/* ── OVERLAY ── */
#overlay{
  position:fixed;inset:0;z-index:2000;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.94);
}
#overlay-box{
  background:#100c08;border:2px solid var(--blood);
  padding:36px 48px;text-align:center;max-width:400px;
}
#overlay-title{font-family:'Creepster',cursive;font-size:40px;letter-spacing:4px;margin-bottom:14px}
#overlay-sub{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text-dim);
  margin-bottom:24px;line-height:1.9;white-space:pre-line}
#overlay-btn{padding:11px 32px;font-family:'Creepster',cursive;font-size:22px;letter-spacing:3px;
  background:var(--blood);color:#fff;border:none;cursor:pointer;transition:all 0.2s}
#overlay-btn:hover{background:var(--crimson);box-shadow:0 0 24px rgba(200,0,0,0.6)}

/* ── SHOT FLASH ── */
#shot-flash{
  position:fixed;inset:0;z-index:850;pointer-events:none;
  background:#fff;opacity:0;
}

/* screen shake */
@keyframes shake{
  0%,100%{transform:translate(0)}
  10%{transform:translate(-10px,-5px) rotate(-0.5deg)}
  20%{transform:translate(10px,5px) rotate(0.5deg)}
  30%{transform:translate(-8px,7px)}
  40%{transform:translate(8px,-7px)}
  50%{transform:translate(-5px,4px)}
  60%{transform:translate(5px,-4px)}
  70%{transform:translate(-3px,3px)}
  80%{transform:translate(3px,-3px)}
  90%{transform:translate(-2px,2px)}
}
.do-shake{animation:shake 0.45s ease}

/* lamp swing subtle */
@keyframes lamp-sway{0%,100%{transform:translateX(-50%) rotate(-1deg)}50%{transform:translateX(-50%) rotate(1deg)}}
#lamp{
  position:fixed;top:-60px;left:50%;transform:translateX(-50%);
  width:4px;height:160px;
  background:linear-gradient(180deg,#1a1208,#3a2808);
  transform-origin:top center;
  animation:lamp-sway 6s ease-in-out infinite;
  z-index:600;pointer-events:none;
}
#lamp-shade{
  position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
  width:60px;height:28px;
  background:linear-gradient(180deg,#2a1a08,#1a1008);
  clip-path:polygon(10% 0,90% 0,100% 100%,0 100%);
  border-bottom:2px solid #4a2a08;
}
#lamp-light{
  position:absolute;bottom:-130px;left:50%;transform:translateX(-50%);
  width:200px;height:130px;
  background:radial-gradient(ellipse at 50% 0%,rgba(200,150,40,0.22) 0%,transparent 70%);
  pointer-events:none;
}
</style>
</head>
<body>

<!-- atmosphere -->
<div id="grain"></div>
<div id="scanlines"></div>
<div id="vignette"></div>
<div id="flicker"></div>
<div id="blood-overlay"></div>
<div id="shot-flash"></div>
<div id="round-banner"></div>

<!-- hanging lamp -->
<div id="lamp"><div id="lamp-shade"></div><div id="lamp-light"></div></div>

<!-- 3D POV scene -->
<div id="scene">

  <!-- TABLE (perspective-transformed) -->
  <div id="table">
    <div id="lamp-pool"></div>

    <!-- DEALER ZONE -->
    <div id="dealer-zone">
      <div id="dealer-figure">
        <div id="dealer-head">
          <div class="dealer-eye" id="eye-l"></div>
          <div class="dealer-eye" id="eye-r"></div>
        </div>
        <div id="dealer-body"></div>
        <div id="dealer-arms">
          <div style="display:flex;flex-direction:column;align-items:flex-end">
            <div class="d-arm"></div><div class="d-hand"></div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-start">
            <div class="d-arm"></div><div class="d-hand"></div>
          </div>
        </div>
      </div>
      <div id="dealer-hp-row"></div>
      <div id="dealer-speech">Watching you sweat...</div>
      <div style="font-family:'Share Tech Mono',monospace;font-size:8px;color:#5a4a38;letter-spacing:2px;margin-top:2px">DEALER ITEMS</div>
      <div id="dealer-items-row"></div>
    </div>

    <!-- GUN ZONE -->
    <div id="gun-zone">
      <svg id="gun-svg" viewBox="0 0 280 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gmetal" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#6a5a40"/>
            <stop offset="35%" style="stop-color:#3a2a18"/>
            <stop offset="100%" style="stop-color:#100c06"/>
          </linearGradient>
          <linearGradient id="gbarrel" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#5a4a35"/>
            <stop offset="50%" style="stop-color:#281808"/>
            <stop offset="100%" style="stop-color:#180e04"/>
          </linearGradient>
          <linearGradient id="gwood" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#5a3018"/>
            <stop offset="100%" style="stop-color:#2a1408"/>
          </linearGradient>
        </defs>
        <!-- barrel -->
        <rect x="2" y="42" width="176" height="22" rx="4" fill="url(#gbarrel)" stroke="#4a3820" stroke-width="1.2"/>
        <!-- muzzle ring -->
        <rect x="0" y="40" width="18" height="26" rx="3" fill="#201408" stroke="#5a4028" stroke-width="1"/>
        <circle cx="9" cy="53" r="6" fill="#080604" stroke="#3a2818" stroke-width="1"/>
        <circle cx="9" cy="53" r="2.5" fill="#040302"/>
        <!-- barrel detail lines -->
        <rect x="20" y="44" width="150" height="3" rx="1" fill="#180e04" opacity="0.9"/>
        <rect x="20" y="57" width="150" height="2.5" rx="1" fill="#382010" opacity="0.5"/>
        <line x1="60" y1="42" x2="60" y2="64" stroke="#281808" stroke-width="1.5" opacity="0.7"/>
        <line x1="110" y1="42" x2="110" y2="64" stroke="#281808" stroke-width="1.5" opacity="0.7"/>
        <line x1="155" y1="42" x2="155" y2="64" stroke="#281808" stroke-width="1.5" opacity="0.7"/>
        <!-- receiver -->
        <rect x="150" y="32" width="50" height="46" rx="5" fill="url(#gmetal)" stroke="#5a4028" stroke-width="1.5"/>
        <rect x="153" y="44" width="44" height="14" rx="2" fill="#100c06" opacity="0.7"/>
        <!-- trigger guard -->
        <path d="M168 78 Q164 92 170 96 L200 96 Q206 92 202 78 Z" fill="url(#gmetal)" stroke="#3a2818" stroke-width="1.2"/>
        <!-- trigger -->
        <rect x="182" y="82" width="8" height="14" rx="1" fill="#1a1008" stroke="#2a1a0a" stroke-width="0.8"/>
        <!-- stock (wood) -->
        <path d="M196 36 L260 32 Q274 34 276 46 Q274 60 260 62 L196 66 Z" fill="url(#gwood)" stroke="#3a1e08" stroke-width="1.2"/>
        <line x1="216" y1="34" x2="214" y2="64" stroke="#2a1408" stroke-width="1" opacity="0.5"/>
        <line x1="236" y1="33" x2="234" y2="63" stroke="#2a1408" stroke-width="1" opacity="0.5"/>
        <!-- ejection port -->
        <rect x="158" y="36" width="20" height="10" rx="2" fill="#0a0806" stroke="#3a2010" stroke-width="0.8"/>
        <!-- muzzle flash (hidden) -->
        <ellipse id="mflash" cx="4" cy="53" rx="0" ry="0" fill="#ff9900" opacity="0"/>
        <ellipse id="mflash2" cx="4" cy="53" rx="0" ry="0" fill="#ffdd00" opacity="0"/>
        <!-- status text above gun -->
        <text id="gun-txt" x="140" y="28" text-anchor="middle" font-family="Share Tech Mono,monospace" font-size="9" fill="#5a4a35" letter-spacing="2">— READY —</text>
      </svg>
    </div>

    <!-- SHELL ZONE -->
    <div id="shell-zone">
      <div id="shell-display"></div>
      <div id="shell-info">— — —</div>
    </div>

    <!-- PLAYER ITEMS (near player edge of table) -->
    <div id="player-items-zone"></div>

    <div id="table-edge"></div>
  </div>
  
  <!-- LOADING ANIMATION (outside table transform) -->
  <div id="loading-overlay">
    <div id="loading-text">RELOADING...</div>
    <div id="loading-shells"></div>
    <div id="loading-count"></div>
  </div>
</div>

<!-- HUD (screen-space, not 3D transformed) -->
<div id="hud">
  <div id="turn-badge" class="your">⬤ YOUR TURN</div>
  <div id="action-row">
    <button class="act-btn shoot-self" id="btn-self" onclick="G.shoot('self')">SHOOT SELF</button>
    <button class="act-btn shoot-dealer" id="btn-dealer" onclick="G.shoot('dealer')">SHOOT DEALER</button>
  </div>
  <div id="player-hp-bar"></div>
</div>

<div id="log-strip"></div>

<div id="stats-hud">
  Won <span id="st-w">0</span> &nbsp;|&nbsp; Lost <span id="st-l">0</span> &nbsp;|&nbsp; Fired <span id="st-f">0</span> &nbsp;|&nbsp; Dealer Hits <span id="st-d">0</span>
</div>

<div id="overlay">
  <div id="overlay-box">
    <div id="overlay-title">—</div>
    <div id="overlay-sub"></div>
    <button id="overlay-btn">—</button>
  </div>
</div>

<script>
const G=(function(){
  let S={
    playerHP:0,dealerHP:0,maxHP:0,
    shells:[],turn:'player',busy:false,
    playerItems:[],dealerItems:[],
    stats:{wins:0,losses:0,fired:0,dhits:0},
    extraTurn:false,sawedBarrel:false,
    playerCuffed:false,dealerCuffed:false,
    currentRound:1,totalRounds:3,
    roundHPs:[3,4,5]
  };
  const ITEMS=['Handcuffs','Cigarettes','Magnifying Glass','Beer','Hacksaw','Adrenaline'];
  const ICONS={'Handcuffs':'⛓','Cigarettes':'🚬','Magnifying Glass':'🔍','Beer':'🍺','Hacksaw':'🪚','Adrenaline':'💉'};
  const DESCS={'Handcuffs':'Dealer skips next turn','Cigarettes':'+1 HP','Magnifying Glass':'Peek next shell','Beer':'Eject current shell','Hacksaw':'Double damage next shot','Adrenaline':'Steal dealer item'};

  function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

  const logEl=document.getElementById('log-strip');
  function log(msg,cls='event'){
    const d=document.createElement('div');
    d.className='log-line '+cls;d.textContent=msg;
    logEl.appendChild(d);
    while(logEl.children.length>6)logEl.removeChild(logEl.firstChild);
  }

  function shake(){
    document.getElementById('scene').classList.remove('do-shake');
    void document.getElementById('scene').offsetWidth;
    document.getElementById('scene').classList.add('do-shake');
    setTimeout(()=>document.getElementById('scene').classList.remove('do-shake'),500);
  }

  function flashBlood(){
    const b=document.getElementById('blood-overlay');
    b.style.opacity='1';setTimeout(()=>b.style.opacity='0',500);
  }

  function muzzleFlash(){
    const f=document.getElementById('mflash'),f2=document.getElementById('mflash2');
    const t=document.getElementById('gun-txt');
    const sf=document.getElementById('shot-flash');
    f.setAttribute('rx','22');f.setAttribute('ry','18');f.setAttribute('opacity','0.95');
    f2.setAttribute('rx','12');f2.setAttribute('ry','10');f2.setAttribute('opacity','0.8');
    sf.style.opacity='0.18';
    t.textContent='— FIRED —';t.setAttribute('fill','#ff5500');
    setTimeout(()=>{
      f.setAttribute('rx','0');f.setAttribute('ry','0');f.setAttribute('opacity','0');
      f2.setAttribute('rx','0');f2.setAttribute('ry','0');f2.setAttribute('opacity','0');
      sf.style.opacity='0';
      t.textContent='— READY —';t.setAttribute('fill','#5a4a35');
    },180);
  }

  function renderHP(){
    // player
    const ph=document.getElementById('player-hp-bar');
    ph.innerHTML='';
    for(let i=0;i<S.maxHP;i++){
      const s=document.createElement('span');
      s.className='p-heart'+(i>=S.playerHP?' dead':'');
      s.textContent=i<S.playerHP?'♥':'♡';ph.appendChild(s);
    }
    // dealer
    const dh=document.getElementById('dealer-hp-row');
    dh.innerHTML='';
    for(let i=0;i<S.maxHP;i++){
      const s=document.createElement('span');
      s.className='d-heart'+(i>=S.dealerHP?' dead':'');
      s.textContent=i<S.dealerHP?'♥':'♡';dh.appendChild(s);
    }
  }

  function renderShells(){
    const d=document.getElementById('shell-display');d.innerHTML='';
    S.shells.forEach(s=>{
      const div=document.createElement('div');
      let cls='shell';
      if(s.fired)cls+=' used';
      else{
        cls+=' '+(s.type==='live'?'live':'blank');
        if(s.known)cls+=(s.type==='live'?' known-live':' known-blank');
      }
      div.className=cls;
      if(s.known&&!s.fired)div.title='KNOWN: '+s.type.toUpperCase();
      d.appendChild(div);
    });
    const active=S.shells.filter(s=>!s.fired);
    const live=active.filter(s=>s.type==='live').length;
    const blank=active.filter(s=>s.type==='blank').length;
    document.getElementById('shell-info').textContent=active.length+' shells  •  '+live+' live  •  '+blank+' blank';
  }

  function renderItems(who){
    const items=who==='player'?S.playerItems:S.dealerItems;
    const el=document.getElementById(who==='player'?'player-items-zone':'dealer-items-row');
    el.innerHTML='';
    const counts={};
    items.forEach(it=>{counts[it]=(counts[it]||0)+1});
    Object.entries(counts).forEach(([it,cnt])=>{
      const b=document.createElement('button');
      b.className='item-btn';
      b.textContent=(ICONS[it]||'?')+' '+it.split(' ')[0];
      b.title=it+': '+DESCS[it];
      if(who==='player'){
        b.onclick=()=>useItem(it);
        if(S.turn!=='player'||S.busy)b.disabled=true;
      } else {b.disabled=true;}
      const c=document.createElement('span');c.className='icount';c.textContent=cnt;b.appendChild(c);
      el.appendChild(b);
    });
  }

  function setButtons(on){
    document.getElementById('btn-self').disabled=!on;
    document.getElementById('btn-dealer').disabled=!on;
    document.querySelectorAll('#player-items-zone .item-btn').forEach(b=>b.disabled=!on);
  }

  function setTurn(){
    const tb=document.getElementById('turn-badge');
    if(S.turn==='player'){
      tb.textContent='⬤ YOUR TURN';tb.className='your';
      document.getElementById('dealer-speech').textContent='Watching... waiting...';
    } else {
      tb.textContent='⬤ DEALER\'S TURN';tb.className='dealer';
    }
  }

  function updateStats(){
    document.getElementById('st-w').textContent=S.stats.wins;
    document.getElementById('st-l').textContent=S.stats.losses;
    document.getElementById('st-f').textContent=S.stats.fired;
    document.getElementById('st-d').textContent=S.stats.dhits;
  }

  function showOverlay(title,sub,btn,col){
    document.getElementById('overlay-title').textContent=title;
    document.getElementById('overlay-title').style.color=col||'#c8b89a';
    document.getElementById('overlay-sub').textContent=sub;
    document.getElementById('overlay-btn').textContent=btn;
    document.getElementById('overlay').style.display='flex';
  }
  function hideOverlay(){document.getElementById('overlay').style.display='none'}

  function showBanner(txt){
    const b=document.getElementById('round-banner');
    b.textContent=txt;b.style.opacity='1';
    setTimeout(()=>b.style.opacity='0',1800);
  }

  function buildShells(r){
    const n=r===1?ri(4,6):r===2?ri(5,7):ri(6,8);
    const live=Math.max(1,Math.floor(n*0.4+Math.random()*0.3*n));
    const arr=[];
    for(let i=0;i<live;i++)arr.push({type:'live',fired:false,known:false});
    for(let i=0;i<n-live;i++)arr.push({type:'blank',fired:false,known:false});
    for(let i=arr.length-1;i>0;i--){const j=ri(0,i);[arr[i],arr[j]]=[arr[j],arr[i]];}
    return arr;
  }

  function buildItems(n){
    const pool=[...ITEMS,...ITEMS,'Cigarettes','Beer'];
    const r=[];for(let i=0;i<n;i++)r.push(pick(pool));return r;
  }

  function nextShell(){return S.shells.find(s=>!s.fired)}

  async function startRound(r){
    S.currentRound=r;S.maxHP=S.roundHPs[r-1];
    S.playerHP=S.maxHP;S.dealerHP=S.maxHP;
    S.shells=buildShells(r);
    const ic=r===1?2:r===2?3:4;
    S.playerItems=buildItems(ic);S.dealerItems=buildItems(ic);
    S.sawedBarrel=false;S.extraTurn=false;
    S.playerCuffed=false;S.dealerCuffed=false;S.turn='player';
    renderHP();renderShells();renderItems('player');renderItems('dealer');
    setButtons(true);setTurn();updateStats();hideOverlay();
    showBanner('ROUND '+r);
    const lv=S.shells.filter(s=>s.type==='live').length;
    log('Round '+r+' — '+S.shells.length+' shells ('+lv+' live)','event');
  }

  async function doShoot(target,shooter){
    const shell=nextShell();if(!shell)return;
    shell.fired=true;S.stats.fired++;
    const dmg=S.sawedBarrel?2:1;S.sawedBarrel=false;
    muzzleFlash();shake();
    await sleep(280);
    if(shell.type==='live'){
      flashBlood();
      const victim=(target===shooter)?shooter:(target==='dealer'?'dealer':'player');
      if(victim==='dealer'){S.dealerHP=Math.max(0,S.dealerHP-dmg);if(shooter==='player')S.stats.dhits++;}
      else{S.playerHP=Math.max(0,S.playerHP-dmg);}
      renderHP();
      log((shooter==='player'?'You':'Dealer')+' → '+(victim==='dealer'?'Dealer':'You')+' — 🔴 LIVE -'+dmg+'HP','live');
    } else {
      log((shooter==='player'?'You':'Dealer')+' → '+(target===shooter?'self':'enemy')+' — ⬜ BLANK','blank');
      if(target===shooter)S.extraTurn=true;
    }
    renderShells();await sleep(150);
  }

  function checkEnd(){
    if(S.playerHP<=0){
      log('You are dead.','death');S.stats.losses++;updateStats();
      setTimeout(()=>showOverlay('YOU DIED','The Dealer smirks.\nAnother soul for the house.','Play Again','#cc0000'),700);
      setButtons(false);S.busy=true;return true;
    }
    if(S.dealerHP<=0){
      log('Dealer down. Round '+S.currentRound+' yours.','death');
      S.stats.wins++;updateStats();
      if(S.currentRound>=S.totalRounds){
        setTimeout(()=>showOverlay('YOU SURVIVED','The house is silent.\nAgainst all odds.','Play Again','#d4a017'),700);
      } else {
        setTimeout(()=>showOverlay('ROUND '+S.currentRound+' CLEARED','The Dealer reloads.\nIt isn\'t over.','Continue','#d4a017'),700);
      }
      setButtons(false);S.busy=true;return true;
    }
    return false;
  }

  async function reloadRound(){
    log('Chamber empty — reloading...','event');
    
    // Show loading animation
    const loading=document.getElementById('loading-overlay');
    const shellsContainer=document.getElementById('loading-shells');
    const countText=document.getElementById('loading-count');
    const shellInfo=document.getElementById('shell-info');
    
    loading.style.display='flex';
    shellsContainer.innerHTML='';
    
    // Build shells first to know count
    S.shells=buildShells(S.currentRound);
    const liveCount=S.shells.filter(s=>s.type==='live').length;
    const blankCount=S.shells.filter(s=>s.type==='blank').length;
    
    // Animate shells loading one by one
    for(let i=0;i<S.shells.length;i++){
      await sleep(200);
      const shell=document.createElement('div');
      shell.className='loading-shell'+(S.shells[i].type==='live'?' live':'');
      shell.style.animationDelay='0s';
      shellsContainer.appendChild(shell);
    }
    
    // Show count after loading
    await sleep(300);
    countText.textContent=S.shells.length+' SHELLS • '+liveCount+' LIVE • '+blankCount+' BLANK';
    
    // Also show in shell info temporarily
    shellInfo.textContent=S.shells.length+' shells • '+liveCount+' live • '+blankCount+' blank';
    shellInfo.classList.add('visible');
    
    await sleep(2000);
    
    // Hide loading animation
    loading.style.display='none';
    
    // Continue with item distribution
    const ni=buildItems(Math.min(2,S.currentRound));
    const di=buildItems(Math.min(2,S.currentRound));
    S.playerItems=[...S.playerItems,...ni];
    S.dealerItems=[...S.dealerItems,...di];
    if(ni.length)log('New items: '+ni.join(', '),'item');
    S.sawedBarrel=false;S.extraTurn=false;S.playerCuffed=false;S.dealerCuffed=false;
    renderShells();renderItems('player');renderItems('dealer');
    log(S.shells.length+' fresh shells loaded','event');
    
    // Hide shell info after 3 seconds
    setTimeout(()=>{
      shellInfo.classList.remove('visible');
      shellInfo.textContent='— — —';
    }, 3000);
    
    S.turn='player';setTurn();S.busy=false;setButtons(true);
  }

  async function shoot(target){
    if(S.busy||S.turn!=='player')return;
    S.busy=true;setButtons(false);
    if(S.playerCuffed&&target==='player'){
      log('You try to move — the cuffs hold.','event');S.busy=false;setButtons(true);return;
    }
    await doShoot(target,'player');
    if(!checkEnd()){
      if(S.shells.every(s=>s.fired)){await reloadRound();return;}
      if(!S.extraTurn){
        S.turn='dealer';setTurn();await sleep(800);await dealerTurn();
      } else {
        S.extraTurn=false;log('Blank — you shoot again.','blank');
        S.busy=false;setButtons(true);setTurn();
      }
    }
    S.busy=false;
  }

  async function dealerTurn(){
    if(S.dealerCuffed){
      log('Dealer strains against the cuffs — skips turn.','item');
      S.dealerCuffed=false;S.turn='player';setTurn();S.busy=false;setButtons(true);return;
    }
    setButtons(false);await sleep(500);
    const shell=nextShell();
    if(!shell){S.turn='player';setTurn();S.busy=false;setButtons(true);return;}
    if(S.dealerItems.length>0&&Math.random()<0.58)await dealerUseItem();
    if(checkEnd()){S.busy=true;return;}
    if(S.shells.every(s=>s.fired)){await reloadRound();return;}
    const lc=S.shells.filter(s=>!s.fired&&s.type==='live').length/S.shells.filter(s=>!s.fired).length;
    let dt=lc>0.6?'player':lc<0.28?'self':Math.random()<0.62?'player':'self';
    document.getElementById('dealer-speech').textContent=dt==='player'?'Your turn to bleed...':'Testing fate...';
    await sleep(800);
    await doShoot(dt==='player'?'player':'dealer','dealer');
    if(!checkEnd()){
      if(S.shells.every(s=>s.fired)){await reloadRound();return;}
      if(S.extraTurn){
        S.extraTurn=false;
        document.getElementById('dealer-speech').textContent='Blank — going again...';
        log('Dealer gets extra turn','blank');
        await sleep(700);await dealerTurn();
      } else {
        S.turn='player';setTurn();S.busy=false;setButtons(true);
        document.getElementById('dealer-speech').textContent='Your move.';
      }
    }
  }

  async function dealerUseItem(){
    if(!S.dealerItems.length)return;
    const avail=[...new Set(S.dealerItems)];
    const shell=nextShell();
    const lc=S.shells.filter(s=>!s.fired&&s.type==='live').length/S.shells.filter(s=>!s.fired).length;
    let c=null;
    if(avail.includes('Magnifying Glass')&&!shell.known)c='Magnifying Glass';
    else if(avail.includes('Hacksaw')&&lc>0.5)c='Hacksaw';
    else if(avail.includes('Handcuffs')&&!S.playerCuffed&&Math.random()<0.6)c='Handcuffs';
    else if(avail.includes('Beer')&&lc<0.25&&S.shells.filter(s=>!s.fired).length>1)c='Beer';
    else if(avail.includes('Cigarettes')&&S.dealerHP<S.maxHP)c='Cigarettes';
    else c=pick(avail);
    S.dealerItems.splice(S.dealerItems.indexOf(c),1);renderItems('dealer');
    document.getElementById('dealer-speech').textContent='Using '+c+'...';
    log('Dealer uses '+c,'item');await sleep(450);
    if(c==='Magnifying Glass'){shell.known=true;renderShells();document.getElementById('dealer-speech').textContent='Next shell: '+shell.type+'.';}
    else if(c==='Hacksaw'){S.sawedBarrel=true;document.getElementById('dealer-speech').textContent='Barrel sawed. +2 dmg.';}
    else if(c==='Handcuffs'){S.playerCuffed=true;document.getElementById('dealer-speech').textContent='Cuffed.';log('You are handcuffed — next turn lost!','item');}
    else if(c==='Beer'){shell.fired=true;log('Dealer ejects shell ('+shell.type+')','blank');renderShells();}
    else if(c==='Cigarettes'){S.dealerHP=Math.min(S.maxHP,S.dealerHP+1);renderHP();document.getElementById('dealer-speech').textContent='+1 HP.';}
    else if(c==='Adrenaline'){
      if(S.playerItems.length){
        const st=pick(S.playerItems);S.playerItems.splice(S.playerItems.indexOf(st),1);
        renderItems('player');log('Dealer steals your '+st,'item');
        S.dealerItems.unshift(st);await dealerUseItem();
      }
    }
    await sleep(300);
  }

  async function useItem(it){
    if(S.busy||S.turn!=='player')return;
    const idx=S.playerItems.indexOf(it);if(idx<0)return;
    S.busy=true;setButtons(false);
    S.playerItems.splice(idx,1);renderItems('player');log('You use '+it,'item');
    if(it==='Magnifying Glass'){const sh=nextShell();if(sh){sh.known=true;renderShells();log('Next: '+sh.type.toUpperCase(),'item');}}
    else if(it==='Cigarettes'){S.playerHP=Math.min(S.maxHP,S.playerHP+1);renderHP();log('+1 HP','item');}
    else if(it==='Beer'){const sh=nextShell();if(sh){sh.fired=true;log('Ejected: '+sh.type,'blank');renderShells();}}
    else if(it==='Hacksaw'){S.sawedBarrel=true;log('Barrel off — 2x damage next shot','item');}
    else if(it==='Handcuffs'){S.dealerCuffed=true;log('Dealer cuffed — skips next turn','item');}
    else if(it==='Adrenaline'){
      if(S.dealerItems.length){
        const st=pick(S.dealerItems);S.dealerItems.splice(S.dealerItems.indexOf(st),1);
        renderItems('dealer');S.playerItems.unshift(st);renderItems('player');
        log('Stole '+st+' from Dealer','item');
      } else log('Dealer has nothing.','event');
    }
    await sleep(250);
    if(checkEnd())return;
    S.busy=false;setButtons(true);updateStats();
  }

  let overlayMode='start';
  document.getElementById('overlay-btn').onclick=function(){
    const txt=this.textContent;
    if(txt==='Continue'){overlayMode='next';}
    else{overlayMode='restart';S.stats={wins:0,losses:0,fired:0,dhits:0};document.getElementById('log-strip').innerHTML='';}
    if(overlayMode==='next'){startRound(S.currentRound+1);}
    else{startRound(1);}
  };

  (function init(){
    showOverlay(
      'BUCKSHOT ROULETTE',
      'Three rounds. One shotgun.\nThe Dealer never loses.\n\nShoot the Dealer to win.\nBlank on yourself = extra turn.\nUse your items wisely.\n\nGood luck. You\'ll need it.',
      'SIT DOWN',
      '#8B0000'
    );
    document.getElementById('overlay-btn').onclick=function(){
      hideOverlay();overlayMode='game';startRound(1);
    };
  })();

  return {shoot,useItem};
})();
</script>
</body>
</html>
