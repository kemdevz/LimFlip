<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloxbash - Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #131621 0%, #191D29 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      overflow-x: hidden;
    }

    .background-effects {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.3;
    }

    .glow-1 {
      width: 400px;
      height: 400px;
      background: #C77DFF;
      top: -100px;
      left: -100px;
    }

    .glow-2 {
      width: 300px;
      height: 300px;
      background: #A855F7;
      bottom: -50px;
      right: -50px;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 40px 20px;
      max-width: 800px;
    }

    .logo {
      margin-bottom: 40px;
    }

    .logo svg {
      width: 120px;
      height: 120px;
    }

    h1 {
      font-size: 72px;
      font-weight: 700;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #C77DFF 0%, #A855F7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 24px;
      font-weight: 500;
      color: #717991;
      margin-bottom: 60px;
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 60px;
      flex-wrap: wrap;
    }

    .countdown-item {
      background: rgba(199, 125, 255, 0.1);
      border: 1px solid rgba(199, 125, 255, 0.3);
      border-radius: 15px;
      padding: 30px 25px;
      min-width: 120px;
    }

    .countdown-number {
      font-size: 48px;
      font-weight: 700;
      color: #C77DFF;
      margin-bottom: 5px;
    }

    .countdown-label {
      font-size: 14px;
      font-weight: 500;
      color: #717991;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .newsletter {
      background: rgba(25, 29, 41, 0.8);
      border: 1px solid #333845;
      border-radius: 15px;
      padding: 40px;
      margin-bottom: 40px;
    }

    .newsletter h2 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .newsletter p {
      font-size: 16px;
      color: #717991;
      margin-bottom: 25px;
    }

    .form {
      display: flex;
      gap: 10px;
      max-width: 400px;
      margin: 0 auto;
      flex-wrap: wrap;
    }

    .form input {
      flex: 1;
      min-width: 200px;
      padding: 15px 20px;
      border: 1.5px solid #404763;
      border-radius: 15px;
      background: #131621;
      color: #FFFFFF;
      font-size: 16px;
      font-family: 'Poppins', sans-serif;
      outline: none;
      transition: border-color 0.3s;
    }

    .form input:focus {
      border-color: #C77DFF;
    }

    .form button {
      padding: 15px 30px;
      background: #C77DFF;
      border: none;
      border-radius: 15px;
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }

    .form button:hover {
      background: #A855F7;
      transform: translateY(-2px);
    }

    .form button:active {
      transform: translateY(0);
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .social-link {
      width: 50px;
      height: 50px;
      background: rgba(199, 125, 255, 0.1);
      border: 1px solid rgba(199, 125, 255, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
    }

    .social-link:hover {
      background: rgba(199, 125, 255, 0.2);
      transform: translateY(-3px);
    }

    .social-link svg {
      width: 24px;
      height: 24px;
      fill: #C77DFF;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 48px;
      }

      .subtitle {
        font-size: 18px;
      }

      .countdown-item {
        min-width: 80px;
        padding: 20px 15px;
      }

      .countdown-number {
        font-size: 32px;
      }

      .countdown-label {
        font-size: 12px;
      }

      .newsletter {
        padding: 30px 20px;
      }

      .form {
        flex-direction: column;
      }

      .form input,
      .form button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="background-effects">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
  </div>

  <div class="container">
    <div class="logo">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="45" stroke="#C77DFF" stroke-width="3" fill="none"/>
        <path d="M50 20 L50 80 M20 50 L80 50" stroke="#C77DFF" stroke-width="3" stroke-linecap="round"/>
        <circle cx="50" cy="50" r="15" fill="#C77DFF"/>
      </svg>
    </div>

    <h1>Coming Soon</h1>
    <p class="subtitle">The ultimate trading platform is on its way</p>

    <div class="countdown">
      <div class="countdown-item">
        <div class="countdown-number" id="days">00</div>
        <div class="countdown-label">Days</div>
      </div>
      <div class="countdown-item">
        <div class="countdown-number" id="hours">00</div>
        <div class="countdown-label">Hours</div>
      </div>
      <div class="countdown-item">
        <div class="countdown-number" id="minutes">00</div>
        <div class="countdown-label">Minutes</div>
      </div>
      <div class="countdown-item">
        <div class="countdown-number" id="seconds">00</div>
        <div class="countdown-label">Seconds</div>
      </div>
    </div>

    <div class="newsletter">
      <h2>Stay Updated</h2>
      <p>Get notified when we launch. Be the first to know!</p>
      <form class="form" onsubmit="handleSubmit(event)">
        <input type="email" placeholder="Enter your email" required>
        <button type="submit">Notify Me</button>
      </form>
    </div>

    <div class="social-links">
      <a href="#" class="social-link">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

        </svg>
      </a>
      <a href="#" class="social-link">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/>
        </svg>
      </a>
      <a href="#" class="social-link">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
        </svg>
      </a>
    </div>
  </div>

  <script>
    // Set launch date (30 days from now)
    const launchDate = new Date();
    launchDate.setDate(launchDate.getDate() + 30);

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = launchDate.getTime() - now;

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = String(days).padStart(2, '0');
      document.getElementById('hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
    }

    function handleSubmit(e) {
      e.preventDefault();
      const email = e.target.querySelector('input').value;
      alert(`Thanks! We'll notify ${email} when we launch.`);
      e.target.reset();
    }

    // Update countdown every second
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
