<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heads Blue Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a2e;
        }
        .sprite {
            width: 300px;
            height: 300px;
            background-image: url('assets/svg/coinflip/HEADS-BLUE.jpg');
            background-repeat: no-repeat;
            background-size: 3000px 300px;
            animation: spriteAnimation 0.5s steps(10) forwards;
        }
        @keyframes spriteAnimation {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: -100% 0;
            }
        }
    </style>
</head>
<body>
    <div class="sprite"></div>
</body>
</html>
